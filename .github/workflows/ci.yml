name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . --output-format=github
      - name: Type check
        shell: bash
        run: |
          set +e
          mypy src --show-error-codes --show-column-numbers --no-error-summary 2>&1 | tee /tmp/mypy-output.txt
          status=${PIPESTATUS[0]}
          python .github/scripts/mypy_annotations.py /tmp/mypy-output.txt
          exit "$status"
      - name: Test
        shell: bash
        run: |
          set +e
          pytest -vv --tb=short 2>&1 | tee /tmp/pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python .github/scripts/pytest_annotations.py /tmp/pytest-output.txt
          fi
          exit "$status"
