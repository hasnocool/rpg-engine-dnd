[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "rpg-engine-dnd"
version = "3.3.0"
description = "Headless deterministic tabletop RPG simulation and persistent-world platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rpg-engine-dnd contributors" }]
dependencies = [
  "aiosqlite>=0.22.1,<1",
  "asyncpg>=0.31,<1",
  "cryptography>=44,<48",
  "fastapi>=0.139.2,<1",
  "pydantic>=2.13.4,<3",
  "textual>=8.2.8,<9",
  "uvicorn[standard]>=0.51,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=2.3,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16,<1",
]

[project.scripts]
rpg-engine = "rpg_engine_dnd.cli:main"
rpg-engine-tui = "rpg_engine_dnd.tui:run_tui"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg_engine_dnd"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["rpg_engine_dnd"]
mypy_path = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true
